name: hash-test
on: push
jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - name: Download and hash VibeFuse portable
        run: |
          curl -sL --retry 2 --max-time 240 -o vf.exe "https://fuseintelligence.org/downloads/VibeFuse/VibeFuse.exe"
          ls -la vf.exe
          sha256sum vf.exe
          file vf.exe || true
